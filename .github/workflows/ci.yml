name: MLOps AI Agent CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

env:
  GIT_TERMINAL_PROMPT: "0"
  PYTHONUNBUFFERED: "1"
  MLFLOW_HTTP_REQUEST_TIMEOUT: "3"
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
  DVC_NO_ANALYTICS: "1"

jobs:
  lint-and-typecheck:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: python -m ruff check --output-format=github .

      - name: Run Ruff Formatter Check
        run: python -m ruff format --check .

      - name: Run Mypy Type Checker (Strict on agent/)
        run: python -m mypy agent

  test-suite:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: python -m pytest -v

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Inference Service Image
        run: docker build -t mlops-inference:test ./inference_service
