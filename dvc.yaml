stages:
  validate:
    cmd: python training/validate.py --config params.yaml
    deps:
      - training/validate.py
      - data/dataset.csv
      - params.yaml

  preprocess:
    cmd: python training/preprocess.py --config params.yaml
    deps:
      - training/preprocess.py
      - data/dataset.csv
      - params.yaml
    outs:
      - data/train.parquet
      - data/test.parquet

  train:
    cmd: python training/train.py --config params.yaml
    deps:
      - training/train.py
      - data/train.parquet
      - data/test.parquet
      - params.yaml
    params:
      - params.yaml:
          - model.n_estimators
          - model.max_depth
          - quality_gate.min_f1
